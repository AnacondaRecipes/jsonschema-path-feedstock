{% set name = "jsonschema-path" %}
{% set version = "0.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/p1c2u/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 8bcbbdcad82f0b6caa85f439e7f41855b71b2d83463316163774c9f2ab56a837

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --ignore-installed --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - poetry-core >=1.0.0
  run:
    - python
    - attrs >=22.2.0
    - pathable >=0.6.0,<0.7.0
    - pyyaml >=5.1
    - referencing <0.38.0
  run_constrained:
    - requests >=2.31.0,<3.0.0

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - jsonschema_path
  requires:
    - pip
    - pytest
    - pytest-cov >=5.0.0
    - responses >=0.25.0
  commands:
    - pip check
    # upstream tests build file:// URIs by concatenating native Windows paths, so $ref resolution fails
    - pytest -vv tests  # [not win]
    - pytest -vv tests --deselect tests/integration/test_schema_path.py::TestSchemaPathOpen::test_file --deselect tests/integration/test_schema_path.py::TestSchemaPathOpen::test_ref_recursive  # [win]
    # --deselect is a node-id prefix match, so the `test_file` entry also drops
    # test_file_ref, which passes on Windows — run it explicitly
    - pytest -vv tests/integration/test_schema_path.py::TestSchemaPathOpen::test_file_ref  # [win]

about:
  home: https://github.com/p1c2u/jsonschema-path
  description: |
    JSONSchema Spec with object-oriented paths
    - Traverse schema like paths
    - Access schema on demand with separate dereferencing accessor layer
  summary: JSONSchema Spec with object-oriented paths
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  dev_url: https://github.com/p1c2u/jsonschema-path
  doc_url: https://github.com/p1c2u/jsonschema-path/blob/main/README.rst

extra:
  recipe-maintainers:
    - bollwyvl
